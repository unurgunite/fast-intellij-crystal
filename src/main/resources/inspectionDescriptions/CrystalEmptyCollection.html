<body>
Reports an empty <code>{}</code> literal that has no element type.
<p>
In Crystal an empty hash literal may not be written as a bare <code>{}</code>; the element types have to be given, for example <code>{} of String =&gt; Int32</code>. An array literal (empty square brackets) already has an inferable element type and is not reported.
</p>
