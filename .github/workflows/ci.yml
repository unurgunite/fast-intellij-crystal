name: CI

on:
  pull_request:
    branches: [ v*.*.*, master ]

# Only the latest run per PR stays alive — force-pushes cancel stale runs
# instead of burning runner minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and uploads artifacts.
permissions:
  contents: read

env:
  CRYSTAL_VERSION: 1.21.0
  JAVA_VERSION: 21

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check version consistency
        run: |
          HEAD_BRANCH="${{ github.head_ref }}"
          if echo "$HEAD_BRANCH" | grep -q '^system/'; then
            echo "Skipping version checks for system/ branch"
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --format=%s)
          MSG_VERSION=$(echo "$COMMIT_MSG" | grep -oE '\[[0-9]+\.[0-9]+\.[0-9]+\]' | tr -d '[]' || true)
          PROP_VERSION=$(grep -E '^version *=' gradle.properties | cut -d= -f2 | tr -d ' ')
          BASE_BRANCH="${{ github.base_ref }}"

          if [ -z "$MSG_VERSION" ]; then
            echo "Commit message must contain version tag, e.g. [1.0.0]"
            echo "  Got: $COMMIT_MSG"
            exit 1
          fi
          if [ "$MSG_VERSION" != "$PROP_VERSION" ]; then
            echo "Version mismatch: commit says [$MSG_VERSION], gradle.properties says $PROP_VERSION"
            exit 1
          fi
          echo "$MSG_VERSION = gradle.properties"

          if echo "$BASE_BRANCH" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            BRANCH_VERSION=$(echo "$BASE_BRANCH" | tr -d 'v')
            if [ "$BRANCH_VERSION" != "$PROP_VERSION" ]; then
              echo "Branch version mismatch: merging into $BASE_BRANCH but version is $PROP_VERSION"
              exit 1
            fi
            echo "$BASE_BRANCH = version"
          else
            echo "Skipping branch check: base branch is '$BASE_BRANCH' (not a version branch)"
          fi

          if ! grep -q "## \[$PROP_VERSION\]" CHANGELOG.md; then
            echo "Missing ## [$PROP_VERSION] section in CHANGELOG.md"
            exit 1
          fi
          echo "CHANGELOG has [$PROP_VERSION]"
          echo "All version checks passed"

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis
        run: ./gradlew detekt

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test
        # Full suite minus CrystalParserTest golden files, which run in the
        # parser-golden step below (excluded via build.gradle.kts)

      - name: Guard against silent empty/skip runs
        # A green `test` that ran 0 tests (broken filter, empty suite) must
        # fail the job: otherwise "CI green" means nothing. Parses the JUnit
        # XML the Gradle Test task just wrote. Threshold: the suite currently
        # has ~990 tests; 500 leaves headroom for future deletions while still
        # catching a degenerate run.
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('build/test-results/test/*.xml')
          if not files:
              print("FAIL: no JUnit XML found — the test task produced no results")
              sys.exit(1)
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          ran = tests - skipped
          print(f"tests={tests} ran={ran} failures={failures} errors={errors} skipped={skipped} files={len(files)}")
          if failures or errors:
              print("FAIL: test failures/errors present")
              sys.exit(1)
          if ran < 500:
              print(f"FAIL: only {ran} tests ran (< 500) — suite did not execute properly")
              sys.exit(1)
          print("Test-count guard passed")
          EOF

      - name: Parser golden files (known-flaky, non-blocking)
        id: parser-golden
        continue-on-error: true
        run: ./gradlew test -PgoldenOnly=true --rerun-tasks

      - name: Report parser-golden status
        if: always()
        run: |
          if [ "${{ steps.parser-golden.outcome }}" = "failure" ]; then
            echo "::warning::CrystalParserTest has failures — check whether they are in the known-flaky set (TODO.md §ParserTest Non-Determinism): ClassDefinition, SpecFile, ProcLiterals, NestedStringInterpolation, AbstractDef, Generics, AliasUnion2, AliasUnion, AnnotationUsage, ImplicitObjectCallBlock, InterpFunAlias, ParamUnion. Failures outside this set must be fixed, not ignored."
          else
            echo "Parser goldens green"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/reports/detekt/
          if-no-files-found: warn
          retention-days: 14

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Build
        run: ./gradlew buildPlugin

      - name: Check change-notes for release branch
        if: startsWith(github.head_ref, 'v')
        run: |
          HEAD_BRANCH="${{ github.head_ref }}"
          if ! echo "$HEAD_BRANCH" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Skipping: not a version branch (head is $HEAD_BRANCH)"
            exit 0
          fi
          VERSION=$(echo "$HEAD_BRANCH" | tr -d 'v')
          if ! grep -q "<h3>$VERSION</h3>" src/main/resources/META-INF/plugin.xml; then
            echo "Missing <h3>$VERSION</h3> in src/main/resources/META-INF/plugin.xml <change-notes>"
            echo "   Add release notes for $VERSION to <change-notes> before merging $HEAD_BRANCH"
            exit 1
          fi
          echo "Found <h3>$VERSION</h3> in change-notes"

      - name: Prepare hashed artifact
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          PROP_VERSION=$(grep -E '^version *=' gradle.properties | cut -d= -f2 | tr -d ' ')
          mkdir -p release
          for f in build/distributions/*.zip; do
            cp "$f" "release/fast-crystal-${PROP_VERSION}-build.${{ github.run_number }}+${SHORT_SHA}.zip"
          done
          ls release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-crystal-plugin
          path: release/*.zip

      - name: Upload verifier diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-diagnostics
          path: |
            build/reports/pluginVerifier/
          if-no-files-found: warn
          retention-days: 14
