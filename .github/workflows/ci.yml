name: CI

on:
  pull_request:
    branches: [ v*.*.*, master ]

# Only the latest run per PR stays alive — force-pushes cancel stale runs
# instead of burning runner minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and uploads artifacts.
permissions:
  contents: read

env:
  CRYSTAL_VERSION: 1.21.0
  JAVA_VERSION: 21

jobs:
  versions:
    # Kept out of `lint` on purpose: these checks read the commit subject and
    # the branch name, and used to run as the first step of `lint`, so a
    # commit-message slip skipped formatting and static analysis entirely —
    # the two things a contributor actually wants feedback on. Nothing is
    # checked out, so this finishes in seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Enough history to reach the merge base of the PR.
          fetch-depth: 0

      - name: Check version consistency
        run: |
          set -euo pipefail

          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          # Infrastructure branches bump nothing.
          if [[ "${GITHUB_HEAD_REF}" == system/* ]]; then
            echo "Skipping version checks for system/ branch"
            exit 0
          fi

          # The released version lives here; every check derives from it.
          PROP_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')
          if [[ -z "$PROP_VERSION" ]]; then
            echo "::error::gradle.properties has no version"
            exit 1
          fi
          echo "gradle.properties version: $PROP_VERSION"

          # A version branch and its gradle.properties must agree, otherwise
          # the release would be tagged with a number the build never saw.
          BASE_BRANCH="${GITHUB_BASE_REF}"
          if [[ "$BASE_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ "${BASE_BRANCH#v}" != "$PROP_VERSION" ]]; then
              echo "::error::Merging into $BASE_BRANCH, but gradle.properties says $PROP_VERSION"
              exit 1
            fi
            echo "Base branch $BASE_BRANCH matches gradle.properties"
          else
            echo "Skipping branch check: base branch '$BASE_BRANCH' is not a version branch"
          fi

          # Every release note has a section the release tooling renders.
          if ! grep -qF "## [$PROP_VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$PROP_VERSION]' section"
            exit 1
          fi
          echo "CHANGELOG.md has a [$PROP_VERSION] section"

          # A version tag in a commit subject is a note about the commit, not a
          # contract: reject only a tag that contradicts gradle.properties.
          # Requiring one on every branch head forced a retitle after every
          # merge, which is what used to fail here. Only this PR's commits are
          # inspected — history before the merge base carries older versions.
          BAD_TAGS=$(git log --format=%s "$BASE_SHA..$HEAD_SHA" \
            | grep -oE '^\[[0-9]+\.[0-9]+\.[0-9]+\]' \
            | tr -d '[]' \
            | grep -vx "$PROP_VERSION" || true)
          if [[ -n "$BAD_TAGS" ]]; then
            echo "::error::Commit subjects mention a version other than $PROP_VERSION: $(echo "$BAD_TAGS" | sort -u | tr '\n' ' ')"
            exit 1
          fi
          echo "No commit subject contradicts $PROP_VERSION"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis
        run: ./gradlew detekt

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test
        # Full suite minus CrystalParserTest golden files, which run in the
        # parser-golden step below (excluded via build.gradle.kts)

      - name: Guard against silent empty/skip runs
        # A green `test` that ran 0 tests (broken filter, empty suite) must
        # fail the job: otherwise "CI green" means nothing. Parses the JUnit
        # XML the Gradle Test task just wrote. Threshold: the suite currently
        # has ~990 tests; 500 leaves headroom for future deletions while still
        # catching a degenerate run.
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('build/test-results/test/*.xml')
          if not files:
              print("FAIL: no JUnit XML found — the test task produced no results")
              sys.exit(1)
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          ran = tests - skipped
          print(f"tests={tests} ran={ran} failures={failures} errors={errors} skipped={skipped} files={len(files)}")
          if failures or errors:
              print("FAIL: test failures/errors present")
              sys.exit(1)
          if ran < 500:
              print(f"FAIL: only {ran} tests ran (< 500) — suite did not execute properly")
              sys.exit(1)
          print("Test-count guard passed")
          EOF

      - name: Parser golden files (known-flaky, non-blocking)
        id: parser-golden
        continue-on-error: true
        run: ./gradlew test -PgoldenOnly=true --rerun-tasks

      - name: Report parser-golden status
        if: always()
        run: |
          if [ "${{ steps.parser-golden.outcome }}" = "failure" ]; then
            echo "::warning::CrystalParserTest has failures — check whether they are in the known-flaky set (TODO.md §ParserTest Non-Determinism): ClassDefinition, SpecFile, ProcLiterals, NestedStringInterpolation, AbstractDef, Generics, AliasUnion2, AliasUnion, AnnotationUsage, ImplicitObjectCallBlock, InterpFunAlias, ParamUnion. Failures outside this set must be fixed, not ignored."
          else
            echo "Parser goldens green"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/reports/detekt/
          if-no-files-found: warn
          retention-days: 14

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [versions, lint, test]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Build
        run: ./gradlew buildPlugin

      - name: Check change-notes for release branch
        if: startsWith(github.head_ref, 'v')
        run: |
          HEAD_BRANCH="${{ github.head_ref }}"
          if ! echo "$HEAD_BRANCH" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Skipping: not a version branch (head is $HEAD_BRANCH)"
            exit 0
          fi
          VERSION=$(echo "$HEAD_BRANCH" | tr -d 'v')
          if ! grep -q "<h3>$VERSION</h3>" src/main/resources/META-INF/plugin.xml; then
            echo "Missing <h3>$VERSION</h3> in src/main/resources/META-INF/plugin.xml <change-notes>"
            echo "   Add release notes for $VERSION to <change-notes> before merging $HEAD_BRANCH"
            exit 1
          fi
          echo "Found <h3>$VERSION</h3> in change-notes"

      - name: Prepare hashed artifact
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          PROP_VERSION=$(grep -E '^version *=' gradle.properties | cut -d= -f2 | tr -d ' ')
          mkdir -p release
          for f in build/distributions/*.zip; do
            cp "$f" "release/fast-crystal-${PROP_VERSION}-build.${{ github.run_number }}+${SHORT_SHA}.zip"
          done
          ls release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-crystal-plugin
          path: release/*.zip

      - name: Upload verifier diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-diagnostics
          path: |
            build/reports/pluginVerifier/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verifier reports
        # Always keep the full verification reports (per-IDE Compatibility /
        # Warnings tabs, same content as the Marketplace verification-results
        # page) so a Marketplace failure can be mapped locally without
        # re-running verifyPlugin.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: |
            build/reports/pluginVerifier/
          if-no-files-found: warn
          retention-days: 14
