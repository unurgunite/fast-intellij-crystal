name: Check source branch
on:
  pull_request:
    branches: [ master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          HEAD_BRANCH="${{ github.head_ref }}"
          if echo "$HEAD_BRANCH" | grep -qE '^(v[0-9]+\.[0-9]+\.[0-9]+|system/.*)$'; then
            echo "OK: $HEAD_BRANCH may merge into master"
          else
            echo "Only v*.*.* or system/* branches may merge into master (got: $HEAD_BRANCH)"
            exit 1
          fi
