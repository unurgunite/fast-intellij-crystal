name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      CRYSTAL_VERSION: 1.21.0

    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check version matches input
        run: |
          PROP_VERSION=$(grep -E '^version *=' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ "$PROP_VERSION" != "${{ inputs.version }}" ]; then
            echo "gradle.properties says $PROP_VERSION, release input says ${{ inputs.version }}"
            exit 1
          fi
          if ! grep -q "## \[$PROP_VERSION\]" CHANGELOG.md; then
            echo "Missing ## [$PROP_VERSION] section in CHANGELOG.md"
            exit 1
          fi
          if ! grep -q "<h3>$PROP_VERSION</h3>" src/main/resources/META-INF/plugin.xml; then
            echo "Missing <h3>$PROP_VERSION</h3> in plugin.xml <change-notes>"
            exit 1
          fi
          echo "Version ${{ inputs.version }} consistent"

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis
        run: ./gradlew detekt

      - name: Test
        run: ./gradlew test

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Prepare artifacts
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          mkdir -p release
          for f in build/distributions/*.zip; do
            cp "$f" "release/fast-crystal-${{ inputs.version }}-build.${{ github.run_number }}+${SHORT_SHA}.zip"
          done
          ls release/

      # - name: Publish to JetBrains Marketplace
      #   env:
      #     PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      #   run: ./gradlew publishPlugin

      - name: Create GitHub Release
        run: |
          TAG="v${{ inputs.version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
